name: Build and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: pipewire
            context: pipewire
          - image: sendspin
            context: sendspin
          - image: squeezelite
            context: squeezelite
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Load version pins
        id: versions
        run: |
          set -a
          # shellcheck disable=SC1091
          . ./versions.env
          set +a
          {
            echo "ALPINE_VERSION=${ALPINE_VERSION}"
            echo "DEBIAN_VERSION=${DEBIAN_VERSION}"
            echo "SENDSPIN_CLI_REF=${SENDSPIN_CLI_REF}"
            echo "SQUEEZELITE_REF=${SQUEEZELITE_REF}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=raw,value=${{ steps.versions.outputs.SENDSPIN_CLI_REF }},enable=${{ matrix.image == 'sendspin' }}
            type=raw,value=${{ steps.versions.outputs.SQUEEZELITE_REF }},enable=${{ matrix.image == 'squeezelite' }},prefix=git-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ALPINE_VERSION=${{ steps.versions.outputs.ALPINE_VERSION }}
            DEBIAN_VERSION=${{ steps.versions.outputs.DEBIAN_VERSION }}
            SENDSPIN_CLI_REF=${{ steps.versions.outputs.SENDSPIN_CLI_REF }}
            SQUEEZELITE_REF=${{ steps.versions.outputs.SQUEEZELITE_REF }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false
