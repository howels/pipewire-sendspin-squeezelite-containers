name: Renovate

on:
  schedule:
    # Weekly Monday 06:00 UTC. Also runs on demand.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - renovate.json
      - .github/workflows/renovate.yml

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.3.14
        with:
          # Create a fine-grained or classic PAT with repo + workflow scope and
          # store it as RENOVATE_TOKEN. GITHUB_TOKEN cannot open PRs from Actions
          # that then trigger other workflows.
          token: ${{ secrets.RENOVATE_TOKEN }}
          configurationFile: renovate.json
        env:
          LOG_LEVEL: info
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_GIT_AUTHOR: "renovate[bot] <29139614+renovate[bot]@users.noreply.github.com>"
