# One-shot / occasional GHCR tag maintenance.
# Publishes prefixed upstream aliases from a container release tag and
# removes bare upstream semver tags that confuse chart Renovate.
name: GHCR retag aliases

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Container release tag to copy from (e.g. v1.0.0)
        required: true
        default: v1.0.0
      sendspin_cli_ref:
        description: sendspin-cpp-cli pin (with leading v)
        required: true
        default: v1.0.1
      alpine_version:
        description: Alpine base pin for pipewire alias
        required: true
        default: "3.22"
      delete_bare_sendspin_cli_tag:
        description: Delete ghcr.io/howels/sendspin:<sendspin_cli_ref> if present
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  retag:
    runs-on: ubuntu-24.04
    steps:
      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Publish prefixed aliases from release tag
        env:
          REL: ${{ inputs.release_tag }}
          CLI: ${{ inputs.sendspin_cli_ref }}
          ALP: ${{ inputs.alpine_version }}
        run: |
          set -eux
          crane copy "$REGISTRY/$OWNER/sendspin:$REL" "$REGISTRY/$OWNER/sendspin:cli-${CLI}"
          crane copy "$REGISTRY/$OWNER/pipewire:$REL" "$REGISTRY/$OWNER/pipewire:alpine-${ALP}"
          # squeezelite already uses git-<sha>; nothing to fix for v1.0.0

      # GHCR rejects registry DELETE for tags (UNSUPPORTED). When the bare CLI
      # tag shares a digest with vX.Y.Z, Packages API version-delete would also
      # remove the release tag. Chart Renovate uses github-releases, so the
      # orphan tag is harmless; delete manually in the GHCR UI if desired.
      - name: Note bare sendspin CLI tag (cannot untag via registry API)
        if: inputs.delete_bare_sendspin_cli_tag
        env:
          CLI: ${{ inputs.sendspin_cli_ref }}
          REL: ${{ inputs.release_tag }}
        run: |
          set -u
          if ! crane digest "$REGISTRY/$OWNER/sendspin:${CLI}" >/dev/null 2>&1; then
            echo "tag not present: $REGISTRY/$OWNER/sendspin:${CLI}"
            exit 0
          fi
          d_cli=$(crane digest "$REGISTRY/$OWNER/sendspin:${CLI}")
          d_rel=$(crane digest "$REGISTRY/$OWNER/sendspin:${REL}" || true)
          echo "bare tag $REGISTRY/$OWNER/sendspin:${CLI} digest=$d_cli"
          echo "release  $REGISTRY/$OWNER/sendspin:${REL} digest=$d_rel"
          if [ -n "$d_rel" ] && [ "$d_cli" = "$d_rel" ]; then
            echo "Same digest as ${REL}: refusing Packages version-delete (would remove the release tag too)."
          fi
          echo "Leave the bare tag, or remove it in the GHCR package UI. Chart Renovate tracks GitHub Releases only."
