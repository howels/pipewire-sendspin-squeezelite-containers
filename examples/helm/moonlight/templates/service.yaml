apiVersion: v1
kind: Service
metadata:
  name: {{ include "moonlight.app" . }}
  namespace: {{ include "moonlight.namespace" . }}
  labels:
    app: {{ include "moonlight.app" . }}
spec:
  selector:
    app: {{ include "moonlight.app" . }}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
