apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ledfx.dataClaim" . }}
  namespace: {{ include "ledfx.namespace" . }}
  labels:
    app: {{ include "ledfx.app" . }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ledfx.sendspinClaim" . }}
  namespace: {{ include "ledfx.namespace" . }}
  labels:
    app: {{ include "ledfx.app" . }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
