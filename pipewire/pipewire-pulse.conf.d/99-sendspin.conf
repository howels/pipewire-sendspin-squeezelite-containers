# Pulse-compatible socket with unrestricted client access (same role as
# PulseAudio auth-anonymous=1). Null sink name and monitor match the chart.
pulse.properties = {
    server.address = [
        {
            address = "unix:native"
            client.access = "allowed"
        }
    ]
    # ~5–20 ms buffering on the Pulse compatibility path.
    pulse.min.req       = 256/48000
    pulse.default.req   = 960/48000
    pulse.min.frag      = 256/48000
    pulse.min.quantum   = 256/48000
    pulse.idle.timeout  = 0
}

pulse.cmd = [
    {
        cmd = "load-module"
        args = "module-null-sink sink_name=sendspin sink_properties=device.description=Sendspin rate=48000 channels=2"
        flags = [ ]
    }
]
