# Lower quantum than the desktop default. 256/48000 ≈ 5.3 ms; suitable for a
# shared null-sink feed into MoonLight without RT privileges in Kubernetes.
context.properties = {
    default.clock.rate        = 48000
    default.clock.quantum     = 256
    default.clock.min-quantum = 128
    default.clock.max-quantum = 1024
}
